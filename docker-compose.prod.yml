services:
  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: nexiflow_backend
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      PORT: 3001
      # External Database (using host's MySQL via host network)
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: ${DB_USER:-clockistry_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-clockistry}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # CORS
      ALLOWED_ORIGINS: ${CORS_ORIGIN:-https://nexi-flow.com}
      # SMTP
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      # PayMongo Microservice URL
      EXTERNAL_PAYMONGO_API_URL: ${EXTERNAL_PAYMONGO_API_URL:-https://api.nexistrydigitalsolutions.com}
      # Frontend & API
      FRONTEND_URL: ${FRONTEND_URL:-https://nexi-flow.com/}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://nexi-flow.com/api}
      ROOT_API_KEY: ${ROOT_API_KEY}
    volumes:
      - ./api/uploads:/app/api/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend (Nginx serving built React app)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: https://nexi-flow.com/api
    container_name: nexiflow_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      - VITE_API_URL=https://nexi-flow.com/api
    depends_on:
      - backend
    networks:
      - nexiflow_network

networks:
  nexiflow_network:
    driver: bridge
